<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <linearGradient id="comm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="aiml-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="x-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="quote-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- ================= CARD 1: AIML CLUB ================= -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="315" height="166" rx="14" fill="url(#comm-bg)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Avatar / Icon -->
    <circle cx="42" cy="46" r="24" fill="#18182b" stroke="url(#aiml-grad)" stroke-width="2"/>
    <text x="42" y="52" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="12" fill="#c084fc">AiML</text>

    <!-- Title & Badges -->
    <text x="76" y="34" font-family="'Inter', sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">AI &amp; ML Club - OCT</text>
    
    <g transform="translate(76, 44)">
      <rect x="0" y="0" width="86" height="20" rx="4" fill="#311042"/>
      <text x="7" y="14" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#e879f9">Vice President</text>

      <rect x="92" y="0" width="94" height="20" rx="4" fill="#1e1b4b"/>
      <text x="100" y="14" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#a5b4fc">AICTE Approved</text>
    </g>

    <!-- Description -->
    <text x="24" y="94" font-family="'Inter', sans-serif" font-size="11.5" fill="#94a3b8">
      <tspan x="24" dy="0">Student-driven community to learn, build and</tspan>
      <tspan x="24" dy="18">explore AI &amp; ML through workshops, hackathons</tspan>
      <tspan x="24" dy="18">and projects.</tspan>
    </text>
  </g>

  <!-- ================= CARD 2: ANANTREX ================= -->
  <g transform="translate(325, 0)">
    <rect x="2" y="2" width="315" height="166" rx="14" fill="url(#comm-bg)" stroke="#1e293b" stroke-width="1.2"/>
    
    <!-- Avatar / Icon -->
    <rect x="20" y="24" width="44" height="44" rx="10" fill="#18182b" stroke="url(#x-grad)" stroke-width="2"/>
    <text x="42" y="52" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="18" fill="url(#x-grad)">X</text>

    <!-- Title & Badges -->
    <text x="76" y="34" font-family="'Inter', sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">AnantreX Community</text>
    
    <g transform="translate(76, 44)">
      <rect x="0" y="0" width="56" height="20" rx="4" fill="#2e1065"/>
      <text x="8" y="14" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#d8b4fe">Founder</text>

      <rect x="62" y="0" width="86" height="20" rx="4" fill="#0f2b48"/>
      <text x="70" y="14" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#7dd3fc">1K+ Members</text>
    </g>

    <!-- Description -->
    <text x="24" y="94" font-family="'Inter', sans-serif" font-size="11.5" fill="#94a3b8">
      <tspan x="24" dy="0">A pan-India tech community blending AI, ML,</tspan>
      <tspan x="24" dy="18">Quantum Computing and Vedic knowledge</tspan>
      <tspan x="24" dy="18">systems.</tspan>
    </text>
  </g>

  <!-- ================= CARD 3: QUOTE ================= -->
  <g transform="translate(650, 0)">
    <rect x="2" y="2" width="248" height="166" rx="14" fill="#0c101d" stroke="url(#quote-border)" stroke-width="1.2"/>
    
    <!-- Quotation Marks -->
    <text x="22" y="38" font-family="Georgia, serif" font-size="34" fill="#6366f1" opacity="0.6">“</text>

    <text x="22" y="58" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" font-style="italic">
      <tspan x="22" dy="0">Building in public, learning</tspan>
      <tspan x="22" dy="18">everyday, and creating</tspan>
      <tspan x="22" dy="18">opportunities for others.</tspan>
      <tspan x="22" dy="24">Because technology is more</tspan>
      <tspan x="22" dy="18">meaningful when we grow</tspan>
      <tspan x="22" dy="18">together.</tspan>
    </text>

    <text x="215" y="152" font-family="Georgia, serif" font-size="34" fill="#6366f1" opacity="0.6">”</text>
  </g>
</svg>
