<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 95" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#141332"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>

    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="btn-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="91" rx="14" fill="url(#footer-bg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Left: Sprout & Text -->
  <g transform="translate(24, 28)">
    <circle cx="16" cy="18" r="16" fill="#14532d" opacity="0.4"/>
    <text x="7" y="25" font-size="18">🌱</text>
    
    <text x="44" y="16" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#ffffff">
      Let's Build Something <tspan fill="#a855f7">Meaningful</tspan> Together
    </text>
    <text x="44" y="36" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">
      Open to collaborations, research, projects and exciting opportunities.
    </text>
  </g>

  <!-- Right: Button Mockup -->
  <g transform="translate(710, 26)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="url(#btn-grad)" filter="url(#btn-glow)"/>
    <text x="24" y="26" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      ✉️ Get In Touch →
    </text>
  </g>
</svg>
