<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Umesh Patel Flagship Systems Matrix">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1813"/>
      <stop offset="100%" stop-color="#040806"/>
    </linearGradient>

    <linearGradient id="border-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="border-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes radarSweep {
        0% { r: 4; opacity: 1; stroke-width: 1.5; }
        100% { r: 16; opacity: 0; stroke-width: 0.5; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -50; }
      }
      .radar-ping { animation: radarSweep 2.2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .stream-dash { stroke-dasharray: 4, 4; animation: dashMove 2.5s linear infinite; }
      .tile-title { font-family: 'Orbitron', 'Inter', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; }
      .tile-desc { font-family: 'Inter', -apple-system, sans-serif; font-size: 11px; fill: #cbd5e1; }
      .tag-text { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- ==================== TILE 1: CV OCCLUSION BENCHMARK (TOP-LEFT) ==================== -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="430" height="140" rx="12" fill="url(#card-grad)" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.35"/>
    <rect x="2" y="2" width="430" height="140" rx="12" fill="none" stroke="url(#border-green)" stroke-width="1"/>

    <!-- Radar Beacon -->
    <circle cx="26" cy="26" r="4.5" fill="#00ff88" filter="url(#soft-glow)"/>
    <circle cx="26" cy="26" r="4.5" fill="none" stroke="#00ff88" class="radar-ping"/>

    <text x="42" y="30" class="tile-title" fill="#00ff88">CV OCCLUSION BENCHMARK</text>
    <text x="410" y="29" font-family="'JetBrains Mono', monospace" font-size="10" fill="#6ee7b7" text-anchor="end">&lt;14ms INFERENCE</text>

    <text x="22" y="58" class="tile-desc">
      Neural network spatial landmark invariance &amp; synthetic partial occlusion testing engine using MediaPipe &amp; PyTorch.
    </text>

    <!-- Tech Tags -->
    <g transform="translate(22, 98)">
      <rect width="66" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="33" y="15" class="tag-text" fill="#6ee7b7">Python</text>

      <rect x="74" width="70" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="109" y="15" class="tag-text" fill="#6ee7b7">PyTorch</text>

      <rect x="152" width="74" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="189" y="15" class="tag-text" fill="#6ee7b7">MediaPipe</text>

      <rect x="234" width="102" height="22" rx="4" fill="#064e3b" stroke="#00ff88" stroke-width="0.8"/>
      <text x="285" y="15" class="tag-text" fill="#a7f3d0">CV Research</text>
    </g>
  </g>

  <!-- ==================== TILE 2: MCP PROTOCOL REGISTRY (TOP-RIGHT) ==================== -->
  <g transform="translate(450, 0)">
    <rect x="2" y="2" width="426" height="140" rx="12" fill="url(#card-grad)" stroke="#00e5ff" stroke-width="1.2" stroke-opacity="0.35"/>
    <rect x="2" y="2" width="426" height="140" rx="12" fill="none" stroke="url(#border-cyan)" stroke-width="1"/>

    <!-- Pulse Beacon -->
    <circle cx="26" cy="26" r="4.5" fill="#00e5ff" filter="url(#soft-glow)"/>
    <circle cx="26" cy="26" r="4.5" fill="none" stroke="#00e5ff" class="radar-ping"/>

    <text x="42" y="30" class="tile-title" fill="#00e5ff">MCP PROTOCOL REGISTRY</text>
    <text x="406" y="29" font-family="'JetBrains Mono', monospace" font-size="10" fill="#67e8f9" text-anchor="end">AGENT FLEETS</text>

    <text x="22" y="58" class="tile-desc">
      Standardized Model Context Protocol (MCP) server registry, schema parsing &amp; autonomous agent tool discovery bridges.
    </text>

    <!-- Tech Tags -->
    <g transform="translate(22, 98)">
      <rect width="66" height="22" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8"/>
      <text x="33" y="15" class="tag-text" fill="#7dd3fc">Python</text>

      <rect x="74" width="94" height="22" rx="4" fill="#0c4a6e" stroke="#00e5ff" stroke-width="0.8"/>
      <text x="121" y="15" class="tag-text" fill="#a5f3fc">MCP Protocol</text>

      <rect x="176" width="70" height="22" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8"/>
      <text x="211" y="15" class="tag-text" fill="#7dd3fc">FastAPI</text>

      <rect x="254" width="82" height="22" rx="4" fill="#0c4a6e" stroke="#0284c7" stroke-width="0.8"/>
      <text x="295" y="15" class="tag-text" fill="#7dd3fc">AsyncIO</text>
    </g>
  </g>

  <!-- ==================== TILE 3: SCHOOLBUS TELEMATICS (BOTTOM-LEFT) ==================== -->
  <g transform="translate(0, 156)">
    <rect x="2" y="2" width="430" height="140" rx="12" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.35"/>
    <rect x="2" y="2" width="430" height="140" rx="12" fill="none" stroke="url(#border-green)" stroke-width="1"/>

    <!-- Radar Beacon -->
    <circle cx="26" cy="26" r="4.5" fill="#34d399" filter="url(#soft-glow)"/>
    <circle cx="26" cy="26" r="4.5" fill="none" stroke="#34d399" class="radar-ping"/>

    <text x="42" y="30" class="tile-title" fill="#34d399">SCHOOLBUS TELEMATICS</text>
    <text x="410" y="29" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a7f3d0" text-anchor="end">LIVE GPS TRACKING</text>

    <text x="22" y="58" class="tile-desc">
      Real-time fleet dispatch platform with live vehicle coordinates, route synchronization &amp; automated notification streams.
    </text>

    <!-- Tech Tags -->
    <g transform="translate(22, 98)">
      <rect width="66" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="33" y="15" class="tag-text" fill="#6ee7b7">Python</text>

      <rect x="74" width="94" height="22" rx="4" fill="#064e3b" stroke="#00ff88" stroke-width="0.8"/>
      <text x="121" y="15" class="tag-text" fill="#a7f3d0">IoT Telematics</text>

      <rect x="176" width="70" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="211" y="15" class="tag-text" fill="#6ee7b7">FastAPI</text>

      <rect x="254" width="88" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="0.8"/>
      <text x="298" y="15" class="tag-text" fill="#6ee7b7">PostgreSQL</text>
    </g>
  </g>

  <!-- ==================== TILE 4: ATS LEADERBOARD ENGINE (BOTTOM-RIGHT) ==================== -->
  <g transform="translate(450, 156)">
    <rect x="2" y="2" width="426" height="140" rx="12" fill="url(#card-grad)" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.35"/>
    <rect x="2" y="2" width="426" height="140" rx="12" fill="none" stroke="url(#border-cyan)" stroke-width="1"/>

    <!-- Pulse Beacon -->
    <circle cx="26" cy="26" r="4.5" fill="#fbbf24" filter="url(#soft-glow)"/>
    <circle cx="26" cy="26" r="4.5" fill="none" stroke="#fbbf24" class="radar-ping"/>

    <text x="42" y="30" class="tile-title" fill="#fbbf24">ATS LEADERBOARD ENGINE</text>
    <text x="406" y="29" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fde68a" text-anchor="end">REAL-TIME EVAL</text>

    <text x="22" y="58" class="tile-desc">
      Full-stack competitive scoring platform with algorithmic assessment tracking, dynamic rankings &amp; institutional analytics.
    </text>

    <!-- Tech Tags -->
    <g transform="translate(22, 98)">
      <rect width="84" height="22" rx="4" fill="#78350f" stroke="#d97706" stroke-width="0.8"/>
      <text x="42" y="15" class="tag-text" fill="#fde68a">TypeScript</text>

      <rect x="92" width="60" height="22" rx="4" fill="#78350f" stroke="#d97706" stroke-width="0.8"/>
      <text x="122" y="15" class="tag-text" fill="#fde68a">React</text>

      <rect x="160" width="70" height="22" rx="4" fill="#78350f" stroke="#d97706" stroke-width="0.8"/>
      <text x="195" y="15" class="tag-text" fill="#fde68a">Node.js</text>

      <rect x="238" width="70" height="22" rx="4" fill="#78350f" stroke="#fbbf24" stroke-width="0.8"/>
      <text x="273" y="15" class="tag-text" fill="#fef08a">Tailwind</text>
    </g>
  </g>
</svg>
