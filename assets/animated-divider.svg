<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 20" width="100%" height="20">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d5ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00d5ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00d5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="comet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00ff9d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d5ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="laser-glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Laser Line -->
  <line x1="20" y1="10" x2="860" y2="10" stroke="url(#divider-grad)" stroke-width="1.8" filter="url(#laser-glow)"/>

  <!-- Center Diamond Nodes -->
  <polygon points="440,4 446,10 440,16 434,10" fill="#00ff9d" filter="url(#laser-glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="220,6 224,10 220,14 216,10" fill="#00d5ff" opacity="0.6"/>
  <polygon points="660,6 664,10 660,14 656,10" fill="#00d5ff" opacity="0.6"/>

  <!-- Energy Comet Animation -->
  <circle cx="20" cy="10" r="4" fill="url(#comet-glow)" filter="url(#laser-glow)">
    <animate attributeName="cx" values="30;850;30" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"/>
  </circle>
</svg>
