<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 74" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="quote-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="border-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d5ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00d5ff" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Dynamic Shimmer Gradient for Text -->
    <linearGradient id="shimmer-text" x1="-100%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#80ffd6"/>
      <stop offset="35%" stop-color="#00d5ff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#80ffd6"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Underline Laser Gradient -->
    <linearGradient id="comet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d5ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes cometSlide {
        0% { stroke-dashoffset: 800; }
        100% { stroke-dashoffset: -800; }
      }
      @keyframes starTwinkle {
        0%, 100% { transform: scale(0.85); opacity: 0.4; }
        50% { transform: scale(1.25); opacity: 1; filter: drop-shadow(0 0 6px #39ff14); }
      }
      @keyframes breatheBorder {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.9; filter: drop-shadow(0 0 8px rgba(57,255,20,0.5)); }
      }
      .laser-track {
        stroke-dasharray: 120, 240;
        animation: cometSlide 4s linear infinite;
      }
      .star-left {
        transform-origin: 36px 36px;
        animation: starTwinkle 3s ease-in-out infinite;
      }
      .star-right {
        transform-origin: 844px 36px;
        animation: starTwinkle 3s ease-in-out 1.5s infinite;
      }
      .border-pulse {
        animation: breatheBorder 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="70" rx="12" fill="url(#quote-bg)" stroke="#1e293b" stroke-width="1.2"/>
  <rect class="border-pulse" x="2" y="2" width="876" height="70" rx="12" fill="none" stroke="url(#border-laser)" stroke-width="1.4"/>

  <!-- Left Star Sparkle -->
  <g class="star-left">
    <path d="M 36 28 Q 36 36 28 36 Q 36 36 36 44 Q 36 36 44 36 Q 36 36 36 28 Z" fill="#00d5ff" filter="url(#star-glow)"/>
  </g>

  <!-- Right Star Sparkle -->
  <g class="star-right">
    <path d="M 844 28 Q 844 36 836 36 Q 844 36 844 44 Q 844 36 852 36 Q 844 36 844 28 Z" fill="#39ff14" filter="url(#star-glow)"/>
  </g>

  <!-- Main Animated Quote Line -->
  <g filter="url(#laser-glow)">
    <text x="440" y="41" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="600" letter-spacing="0.4">
      <tspan fill="url(#shimmer-text)">“Make this Zindagi full of wonders and extraordinary moments.”</tspan>
      <tspan fill="#39ff14" font-weight="700"> — Umesh Patel</tspan>
    </text>
  </g>

  <!-- Animated Comet Laser Underline -->
  <line x1="120" y1="56" x2="760" y2="56" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="120" y1="56" x2="760" y2="56" stroke="url(#comet-grad)" stroke-width="2" stroke-linecap="round" class="laser-track" filter="url(#laser-glow)"/>
</svg>
