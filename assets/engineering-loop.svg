<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="loop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141e33"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="beam-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d5ff"/>
      <stop offset="50%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00d5ff"/>
    </linearGradient>

    <style>
      @keyframes synDashForward {
        to { stroke-dashoffset: -120; }
      }
      @keyframes synDashBackward {
        to { stroke-dashoffset: 120; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 3px rgba(57,255,20,0.3)); opacity: 0.95; }
        50% { filter: drop-shadow(0 0 10px rgba(0,213,255,0.7)); opacity: 1; }
      }
      @keyframes quoteBreathe {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(57,255,20,0.6)); }
      }
      @keyframes radarPing {
        0% { r: 5; opacity: 1; stroke-width: 2; }
        100% { r: 16; opacity: 0; stroke-width: 0.5; }
      }
      .flow-forward {
        stroke-dasharray: 6, 6;
        animation: synDashForward 2.5s linear infinite;
      }
      .flow-return {
        stroke-dasharray: 6, 6;
        animation: synDashBackward 3.5s linear infinite;
      }
      .node-card {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .quote-text {
        animation: quoteBreathe 4s ease-in-out infinite;
      }
      .ping {
        animation: radarPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
    </style>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="876" height="232" rx="14" fill="url(#loop-bg)" stroke="#1e293b" stroke-width="1.4"/>
  <rect x="2" y="2" width="876" height="232" rx="14" fill="none" stroke="url(#beam-laser)" stroke-width="1.2" opacity="0.45"/>

  <!-- Subtle grid lines background -->
  <g stroke="#39ff14" stroke-width="0.5" opacity="0.05">
    <line x1="40" y1="0" x2="40" y2="236"/>
    <line x1="220" y1="0" x2="220" y2="236"/>
    <line x1="440" y1="0" x2="440" y2="236"/>
    <line x1="660" y1="0" x2="660" y2="236"/>
    <line x1="840" y1="0" x2="840" y2="236"/>
    <line x1="0" y1="65" x2="880" y2="65"/>
    <line x1="0" y1="148" x2="880" y2="148"/>
  </g>

  <!-- ==================== FLOW CONNECTORS ==================== -->
  <!-- Forward Path 1 -> 2 -->
  <line x1="245" y1="65" x2="340" y2="65" stroke="#00d5ff" stroke-width="2" class="flow-forward" filter="url(#soft-glow)"/>
  <polygon points="344,65 334,60 334,70" fill="#00d5ff" filter="url(#soft-glow)"/>

  <!-- Forward Path 2 -> 3 -->
  <line x1="540" y1="65" x2="635" y2="65" stroke="#39ff14" stroke-width="2" class="flow-forward" filter="url(#soft-glow)"/>
  <polygon points="639,65 629,60 629,70" fill="#39ff14" filter="url(#soft-glow)"/>

  <!-- Return Loop Track: Node 3 -> Bottom -> Node 1 -->
  <!-- Right Turn from Node 3 -->
  <path d="M 830 65 L 852 65 Q 860 65 860 73 L 860 140 Q 860 148 852 148 L 610 148" 
        fill="none" stroke="#00ff9d" stroke-width="1.8" class="flow-forward" opacity="0.85"/>

  <!-- Left Return into Node 1 -->
  <path d="M 270 148 L 28 148 Q 20 148 20 140 L 20 73 Q 20 65 28 65 L 45 65" 
        fill="none" stroke="#00d5ff" stroke-width="1.8" class="flow-forward" opacity="0.85"/>
  <polygon points="50,65 40,60 40,70" fill="#00d5ff" filter="url(#soft-glow)"/>

  <!-- ==================== THREE PRIMARY STAGES ==================== -->

  <!-- NODE 1: HYPOTHESIS -->
  <g transform="translate(50, 30)" class="node-card">
    <rect width="195" height="70" rx="10" fill="url(#card-bg)" stroke="#00d5ff" stroke-width="1.4"/>
    <circle cx="24" cy="26" r="6" fill="#00d5ff" filter="url(#soft-glow)"/>
    <circle cx="24" cy="26" r="6" fill="none" stroke="#00d5ff" class="ping"/>
    
    <text x="38" y="30" font-family="'JetBrains Mono', 'Segoe UI Mono', monospace" font-size="13" font-weight="700" fill="#c9ffd6" letter-spacing="1">01. HYPOTHESIS</text>
    <text x="38" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#7dd3fc">Empirical Formulation</text>
    <text x="38" y="62" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Research · Formal Bounds</text>
  </g>

  <!-- NODE 2: IMPLEMENTATION -->
  <g transform="translate(345, 30)" class="node-card">
    <rect width="195" height="70" rx="10" fill="url(#card-bg)" stroke="#39ff14" stroke-width="1.4"/>
    <circle cx="24" cy="26" r="6" fill="#39ff14" filter="url(#soft-glow)"/>
    <circle cx="24" cy="26" r="6" fill="none" stroke="#39ff14" class="ping"/>

    <text x="38" y="30" font-family="'JetBrains Mono', 'Segoe UI Mono', monospace" font-size="13" font-weight="700" fill="#c9ffd6" letter-spacing="1">02. EXECUTION</text>
    <text x="38" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#86efac">Systems Engineering</text>
    <text x="38" y="62" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Fast Pipelines · Clean Arch</text>
  </g>

  <!-- NODE 3: BENCHMARK -->
  <g transform="translate(640, 30)" class="node-card">
    <rect width="195" height="70" rx="10" fill="url(#card-bg)" stroke="#f59e0b" stroke-width="1.4"/>
    <circle cx="24" cy="26" r="6" fill="#f59e0b" filter="url(#soft-glow)"/>
    <circle cx="24" cy="26" r="6" fill="none" stroke="#f59e0b" class="ping"/>

    <text x="38" y="30" font-family="'JetBrains Mono', 'Segoe UI Mono', monospace" font-size="13" font-weight="700" fill="#c9ffd6" letter-spacing="1">03. BENCHMARK</text>
    <text x="38" y="48" font-family="'Inter', sans-serif" font-size="11" fill="#fde68a">Rigorous Evaluation</text>
    <text x="38" y="62" font-family="'Inter', sans-serif" font-size="10" fill="#64748b">Stress · Latency · Pareto</text>
  </g>

  <!-- ==================== SYSTEM HARDENING PILL ==================== -->
  <g transform="translate(265, 126)">
    <rect width="350" height="44" rx="22" fill="#0f172a" stroke="#00ff9d" stroke-width="1.4" filter="url(#soft-glow)"/>
    
    <!-- Moving particle inside hardening pill -->
    <circle cx="26" cy="22" r="4" fill="#39ff14" filter="url(#soft-glow)"/>
    <text x="40" y="27" font-family="'JetBrains Mono', 'Segoe UI Mono', monospace" font-size="12" font-weight="700" fill="#39ff14" letter-spacing="1">
      ⚡ SYSTEM HARDENING &amp; OPTIMIZATION
    </text>
  </g>

  <!-- ==================== ANIMATED MANIFESTO QUOTE ==================== -->
  <text class="quote-text" x="440" y="208" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#e2e8f0" letter-spacing="0.5">
    “Research tells me what works. Engineering makes it reliable. Product makes it useful.”
  </text>
</svg>
