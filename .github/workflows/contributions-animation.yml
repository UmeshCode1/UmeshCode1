name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 */12 * * *"    # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize dist directory
        run: mkdir -p dist && sudo chown -R $USER:$USER dist

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: UmeshCode1

      - name: Fix permissions before snake
        run: sudo chown -R $USER:$USER dist

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: UmeshCode1
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg
            dist/github-contribution-grid-snake.gif

      - name: Fix permissions for deploy
        run: sudo chown -R $USER:$USER dist

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        if: success()
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Completion message
        if: success()
        run: echo "Snake and Pacman contribution animations generated successfully!"
